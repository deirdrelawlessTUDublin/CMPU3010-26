# ==============================================================
# CMPU 3010 - Databases 2
# CommunityCare PostgreSQL Environment
#
# This Docker Compose file creates:
#   1. PostgreSQL 18 database server
#   2. pgAdmin 4 web interface
#
# Start:
#   docker compose up -d
#
# Stop:
#   docker compose down
#
# IMPORTANT:
#   "docker compose down" preserves your database data.
#
#   "docker compose down -v" DELETES the database volume.
#   Use -v only when you deliberately want to reset the
#   CommunityCare database to its original state.
# ==============================================================


services:

  # ============================================================
  # PostgreSQL Database Server
  # ============================================================
  postgres:

    # All students use the same PostgreSQL version.
    image: postgres:18

    # Name shown in Docker Desktop / docker commands.
    container_name: db2-postgres

    # Restart automatically unless explicitly stopped.
    restart: unless-stopped

    # ----------------------------------------------------------
    # PostgreSQL initial configuration
    # ----------------------------------------------------------
    environment:

      # PostgreSQL administrator account.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

      # This database is created automatically when PostgreSQL
      # is initialised for the first time.
      POSTGRES_DB: postgres

    # ----------------------------------------------------------
    # Port
    # ----------------------------------------------------------
    #
    # Makes PostgreSQL accessible from the student's computer.
    #
    # Applications such as DBeaver and Python should use:
    #
    #   Host:     localhost
    #   Port:     5432
    #   Database: communitycare
    #   Username: postgres
    #   Password: postgres
    #
    ports:
      - "5432:5432"

    # ----------------------------------------------------------
    # Storage and initialisation
    # ----------------------------------------------------------
    volumes:

      # Persistent PostgreSQL storage.
      #
      # The database remains here even if the container
      # is stopped or removed.
      - postgres_data:/var/lib/postgresql

      # Mount the local init directory into PostgreSQL's
      # automatic initialisation directory.
      #
      # SQL files in ./init are executed automatically when
      # PostgreSQL is created for the FIRST time.
      #
      # For Lab 1:
      #
      #   init/
      #      01-communitycare-schema.sql
      #      02-communitycare-data.sql
      #
      - ./init:/docker-entrypoint-initdb.d

    # ----------------------------------------------------------
    # Health check
    # ----------------------------------------------------------
    #
    # Docker uses this to determine when PostgreSQL is ready
    # to accept connections.
    #
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d communitycare"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  # ============================================================
  # pgAdmin 4
  # ============================================================
  pgadmin:

    # pgAdmin web interface.
    image: dpage/pgadmin4:latest

    # Name shown in Docker Desktop.
    container_name: db2-pgadmin

    # Restart automatically unless explicitly stopped.
    restart: unless-stopped

    # ----------------------------------------------------------
    # pgAdmin login
    # ----------------------------------------------------------
    #
    # These credentials are for logging into pgAdmin itself.
    # They are NOT the PostgreSQL credentials.
    #
    environment:
      PGADMIN_DEFAULT_EMAIL: student@tudublin.ie
      PGADMIN_DEFAULT_PASSWORD: postgres

    # ----------------------------------------------------------
    # pgAdmin web port
    # ----------------------------------------------------------
    #
    # Students access pgAdmin at:
    #
    #   http://localhost:8080
    #
    ports:
      - "8080:80"

    # ----------------------------------------------------------
    # Persistent pgAdmin configuration
    # ----------------------------------------------------------
    volumes:
      - pgadmin_data:/var/lib/pgadmin

    # ----------------------------------------------------------
    # Startup dependency
    # ----------------------------------------------------------
    #
    # Wait until PostgreSQL is healthy before starting pgAdmin.
    #
    depends_on:
      postgres:
        condition: service_healthy


# ==============================================================
# Persistent Docker Volumes
# ==============================================================
#
# These are managed by Docker and exist independently of the
# containers.
#
# postgres_data:
#   Contains the PostgreSQL databases and data.
#
# pgadmin_data:
#   Contains pgAdmin settings.
#
volumes:
  postgres_data:
  pgadmin_data: